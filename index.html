<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Formulário de Cadastro</title>
</head>

<style>

    .form-container {
        max-width: 400px;
        padding: 20px;
    }

</style>

<body>
    <div class="d-flex align-itens-center justify-content-center min-vh-100">
        <div class="form-container w-100">
            <form class="text-center">
                <h1>Registre-se</h1>
                <div class="form-floating mb-3">
                    <input type="text" placeholder="seu nome" class="form-control border-dark" id="floatingName">
                    <label for="floatingName">Nome Completo</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="email" placeholder="email@exemplo.com" class="form-control border-dark" id="floatingEmail">
                    <label for="floatingEmail">E-mail</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="tel" placeholder="seu telefone" class="form-control border-dark" id="floatingTel">
                    <label for="floatingTel">Telefone</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" placeholder="sua senha" class="form-control border-dark" id="floatPassword">
                    <label for="floatPassword">Senha</label>
                </div>
                <div class="form-check form-switch text-start mb-3">
                    <input type="checkbox" class="form-check-input border-dark" role="switch" id="flexSwithCheckDefault">
                    <label for="flexSwithCheckDefault" class="form-check-label">Desejo receber notícias</label>
                </div>
                    <button type="submit" class="btn btn-success w-100 py-2">Enviar</button>
                    <p class="mt-3 text-muted">
                        © 2025 - Todos os direitos reservados
                    </p>
            </form>
        </div>
    </div>
</body>
</html>
